<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quandary Control</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="/vendor/lucide/lucide.css">
    <link rel="stylesheet" href="/css/ui.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/ui.js"></script>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="40 40 3380 3380" focusable="false">
                    <defs>
                        <mask id="qc-brand-eye-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="3456" height="3456">
                            <rect x="0" y="0" width="3456" height="3456" fill="#fff"/>
                            <path fill="#000" d="M94.4,1507.2 Q1474.4,387.2 2854.4,1507.2 Q1474.4,2627.2 94.4,1507.2 Z"/>
                        </mask>
                    </defs>
                    <path class="qc-ring" mask="url(#qc-brand-eye-cut)" d="M2509.9,2457.3c240.8-251.2,377.7-594,377.7-950.8c0-775.4-633.9-1405.9-1413.2-1405.9S61.3,731.7,61.3,1507.2c0,503.8,253.6,937.7,643.2,1185.5l317.7-317.7c-306.6-165-516-492-516-867.8c0-559.8,416.3-981.9,968.2-981.9c552,0,968.2,424.7,968.2,984.5c0,195.6-74.3,462-239.1,638l-306.8,237.6l509.7,526.5h566.8L2509.9,2457.3z"/>
                    <polygon class="qc-purple" points="3394.7,3355.4 2836.1,3355.4 2533.1,3047.1 3091.7,3047.1"/>
                    <path class="qc-purple" fill-rule="evenodd" d="M959.2,1507.2 a515.2,515.2 0 1,0 1030.4,0 a515.2,515.2 0 1,0 -1030.4,0 Z M1261.6,1507.2 a212.8,212.8 0 1,0 425.6,0 a212.8,212.8 0 1,0 -425.6,0 Z"/>
                </svg>
            </span>
            <span>Quandary Control<small>Escape room operations</small></span>
        </a>

        <div class="nav-label">Manage</div>
        <a class="nav-item" href="#rooms" data-nav="rooms"><i class="icon-door-open"></i>Rooms <span class="count" data-count="rooms"></span></a>
        <a class="nav-item" href="#themes" data-nav="themes"><i class="icon-palette"></i>Player themes <span class="count" data-count="themes"></span></a>
        <a class="nav-item" href="#settings" data-nav="settings"><i class="icon-settings"></i>Settings</a>

        <div class="nav-label">Quick open</div>
        <div id="quick-rooms" class="stack-sm" style="gap:2px"></div>

        <div class="sidebar-footer">
            <a class="nav-item" href="/tv" target="_blank" rel="noopener"><i class="icon-tv"></i>TV portal</a>
            <button class="nav-item" data-action="toggle-ui-theme"><i data-theme-icon class="icon-sun"></i>Toggle light / dark</button>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <button class="btn btn-ghost btn-icon mobile-nav-btn" data-toggle-sidebar aria-label="Menu"><i class="icon-menu"></i></button>
            <h1 id="view-title">Rooms</h1>
            <div class="spacer"></div>
            <div id="topbar-actions" class="row"></div>
        </header>

        <main class="content" id="view"></main>
    </div>
</div>

<template id="tpl-loading">
    <div class="room-grid">
        <div class="skeleton" style="height:210px"></div>
        <div class="skeleton" style="height:210px"></div>
        <div class="skeleton" style="height:210px"></div>
    </div>
</template>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/admin-app.js"></script>
</body>
</html>
