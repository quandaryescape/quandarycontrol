<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow</title>
    <link rel="stylesheet" href="/vendor/lucide/lucide.css">
    <link rel="stylesheet" href="/css/slideshow.css">
    <link rel="stylesheet" href="/css/slideshow-player.css">
</head>
<body>
    <div id="app" class="ssp">
        <div class="ssp-loading" id="loading"><div class="spinner"></div></div>

        <!-- Chooser: shown when a room has more than one slideshow -->
        <section class="chooser" id="chooser" hidden>
            <header class="chooser-head">
                <div class="chooser-room" id="chooser-room"></div>
                <h1>Choose a briefing</h1>
                <p>Use the arrow keys, remote or touch to pick one.</p>
            </header>
            <div class="chooser-grid" id="chooser-grid" role="listbox"></div>
            <footer class="chooser-foot"><button class="ghost-btn" id="chooser-back"><i class="icon-arrow-left"></i>Back to the game</button></footer>
        </section>

        <!-- Playback -->
        <section class="player" id="player" hidden>
            <div class="ss-frame ss-stage" id="stage"></div>
            <div class="progress-segments" id="segments"></div>
            <div class="player-controls" id="controls">
                <button class="pc-btn" id="prev" aria-label="Previous slide"><i class="icon-chevron-left"></i></button>
                <span class="pc-count"><span id="count-current">1</span> / <span id="count-total">1</span></span>
                <button class="pc-btn" id="next" aria-label="Next slide"><i class="icon-chevron-right"></i></button>
                <button class="pc-btn" id="pause" aria-label="Pause auto-advance" hidden><i class="icon-pause"></i></button>
                <span class="pc-spacer"></span>
                <button class="pc-btn" id="close" aria-label="Exit slideshow"><i class="icon-x"></i></button>
            </div>
            <button class="unmute" id="unmute" hidden><i class="icon-volume-x"></i>Tap for sound</button>
            <div class="the-end" id="the-end" hidden>
                <h2>That's everything!</h2>
                <div class="end-actions">
                    <button class="big-btn" id="end-replay"><i class="icon-rotate-ccw"></i>Watch again</button>
                    <button class="big-btn primary" id="end-continue"><i class="icon-play"></i>Start the game</button>
                </div>
            </div>
        </section>

        <section class="ssp-message" id="message" hidden>
            <i class="icon-presentation"></i>
            <h1 id="message-title">No slideshow yet</h1>
            <p id="message-text">This room doesn't have a slideshow.</p>
            <button class="big-btn primary" id="message-back"><i class="icon-arrow-left"></i>Back to the game</button>
        </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/slideshow-render.js"></script>
    <script src="/js/slideshow-player.js"></script>
</body>
</html>
